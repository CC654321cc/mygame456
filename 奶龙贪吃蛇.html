<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>奶龙贪吃蛇</title>
<style>
  :root{
    --bg:#070b16;
    --panel:rgba(18,26,48,.72);
    --line:rgba(120,200,255,.18);
    --neon:#4de3ff;
    --neon2:#b47bff;
    --food:#35e07a;
    --relic:#ff5fa2;
    --gold:#ffce40;
    --text:#dbe9ff;
    --dim:#7f93b8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1100px 700px at 15% -10%, #16224a 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 110%, #2a1440 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100%;padding:18px;
    overflow:hidden;
  }
  .wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  h1{
    margin:0;font-size:clamp(20px,5.2vw,28px);font-weight:800;letter-spacing:.14em;
    background:linear-gradient(92deg,var(--neon),var(--neon2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 14px rgba(77,227,255,.35));
  }
  .sub{font-size:12px;color:var(--dim);letter-spacing:.08em;white-space:nowrap}
  .sub b{color:var(--neon);font-weight:800}
  .hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:9px 12px;backdrop-filter:blur(8px);
  }
  .card .k{font-size:11px;color:var(--dim);letter-spacing:.12em}
  .card .v{font-size:clamp(18px,5vw,22px);font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
  .card .v.cyan{color:var(--neon);text-shadow:0 0 12px rgba(77,227,255,.45)}
  .card .v.pink{color:var(--food);text-shadow:0 0 12px rgba(53,224,122,.45)}
  .card .v.purple{color:var(--neon2);text-shadow:0 0 12px rgba(180,123,255,.45)}
  .card .v.gold{color:var(--gold);text-shadow:0 0 12px rgba(255,206,64,.45)}

  .stage{position:relative;border-radius:18px;overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 0 0 1px rgba(0,0,0,.4) inset, 0 18px 50px rgba(0,0,0,.55), 0 0 60px rgba(77,227,255,.08);
    background:#080d1c;
  }
  canvas{display:block;width:100%;height:auto;touch-action:none}

  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;text-align:center;
    padding:20px;background:rgba(6,10,22,.82);backdrop-filter:blur(4px);
    transition:opacity .18s ease;
  }
  .overlay.hide{opacity:0;pointer-events:none}
  .overlay h2{margin:0;font-size:clamp(20px,5.6vw,26px);letter-spacing:.1em}
  .overlay p{margin:0;color:var(--dim);font-size:13px;line-height:1.8;max-width:36ch}
  .overlay p em{font-style:normal;font-weight:700}
  .final{color:var(--neon);font-weight:800;font-size:15px}
  .legend{display:flex;gap:11px;flex-wrap:wrap;justify-content:center;font-size:11px;color:var(--dim)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .btn{
    appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;letter-spacing:.1em;
    color:#04121a;background:linear-gradient(96deg,var(--neon),#7ef0c8);
    padding:11px 26px;border-radius:999px;
    box-shadow:0 0 24px rgba(77,227,255,.42);
    transition:transform .12s ease, box-shadow .2s ease;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 0 34px rgba(77,227,255,.62)}
  .btn:active{transform:translateY(1px) scale(.98)}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none;padding:8px 16px;font-size:12px}
  .btn.ghost:hover{border-color:var(--neon);color:var(--neon)}

  footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .keys{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
  kbd{
    background:rgba(255,255,255,.06);border:1px solid var(--line);border-bottom-width:2px;
    border-radius:6px;padding:2px 7px;font-family:inherit;font-size:11px;color:#bcd3f5;
  }
  .pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center}
  .pad button{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);
    font-size:19px;cursor:pointer;transition:background .15s,border-color .15s;
  }
  .pad button:active{background:rgba(77,227,255,.18);border-color:var(--neon)}
  .pad .sp{visibility:hidden}
  @media (hover:hover) and (pointer:fine){ .pad{display:none} }
  @media (max-width:520px){ .pad{display:grid} }
  @media (max-width:430px){ .hud{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>奶龙贪吃蛇</h1>
    <div class="sub">NAILONG SNAKE · 对手 <b id="bots">3</b></div>
  </header>

  <div class="hud">
    <div class="card"><div class="k">得分</div><div class="v cyan" id="score">0</div></div>
    <div class="card"><div class="k">最高分</div><div class="v purple" id="best">0</div></div>
    <div class="card"><div class="k">长度</div><div class="v pink" id="len">3</div></div>
    <div class="card"><div class="k">击杀</div><div class="v gold" id="kills">0</div></div>
  </div>

  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">准备开始</h2>
      <p id="ovText">用 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 控制方向<br>地图比一屏大得多，视角会跟着奶龙滚动，右上角小地图看全局<br>吃到青色果实就会变长，别撞墙也别咬到自己 · 嫌快嫌慢按 <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></p>
      <div class="legend" id="ovLegend">
        <span><i style="background:#ffc42e"></i>你</span>
        <span><i style="background:#35d7ff"></i>青</span>
        <span><i style="background:#b47bff"></i>紫</span>
        <span><i style="background:#ff5fa2"></i>玫红</span>
        <span><i style="background:#35e07a"></i>果实</span>
      </div>
      <div class="final" id="ovFinal" style="display:none"></div>
      <button class="btn" id="ovBtn">开始游戏</button>
    </div>
  </div>

  <footer>
    <div class="keys">
      <span><kbd>空格</kbd> 暂停</span>
      <span><kbd>R</kbd> 重开</span>
      <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 速度</span>
    </div>
    <button class="btn ghost" id="pauseBtn">暂停</button>
  </footer>

  <div class="pad">
    <button class="sp"></button>
    <button data-dir="up">▲</button>
    <button class="sp"></button>
    <button data-dir="left">◀</button>
    <button data-dir="down">▼</button>
    <button data-dir="right">▶</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ===== 配置 =====
  // 地图比一屏大得多，视角（摄像机）跟着奶龙滚动，而不是整块棋盘钉在屏幕上
  const WCOLS = 48, WROWS = 48;               // 世界格数
  const VIS_COLS = 20, VIS_ROWS = 20;         // 一屏能看见多少格
  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const SIZE = canvas.width;                  // 逻辑边长
  const CELL = SIZE / VIS_COLS;
  canvas.width = canvas.height = SIZE * DPR;
  canvas.style.width = canvas.style.height = '100%';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // tick 数值越大 = 每一步间隔越长 = 蛇走得越慢
  const SPEEDS = { 1: { name: '悠闲', tick: 230 }, 2: { name: '标准', tick: 175 }, 3: { name: '迅捷', tick: 125 } };

  // ===== 对手与果实参数 =====
  const BOT_COUNT = 3;          // 场上最多同时存在几只对手
  const BOT_LEN = 3;            // 对手出生长度
  const BOT_RESPAWN_MS = 3500;  // 一只对手阵亡后，隔多久补位（想让对手死一个少一个，把它改成 Infinity）
  const FOOD_TARGET = 3;        // 场上常驻的普通果实数量
  const RELIC_TTL = 22000;      // 遗骸果实存在时长（毫秒），最后 5 秒开始闪
  const RELIC_DROP_MAX = 16;    // 单只对手阵亡最多掉几颗遗骸果实
  const MAX_FOODS = 64;         // 场上果实总数硬上限
  const RELIC_SCORE = 20;       // 遗骸果实每颗基础分（再乘速度档位；普通果实是 10）

  // ===== 视角跟随参数 =====
  const CAM_EASE = 8.5;         // 镜头跟手的程度：越大跟得越紧，越小越飘
  const FOOD_MIN = 4, FOOD_MAX = 13;   // 普通果实优先撒在离奶龙多远的地方（曼哈顿距离区间）

  // 三只对手的性格：mistake 越高越容易犯浑，也就越容易被你钓到身上撞死

    { name: '青',   hue: 188, hex: '#35d7ff', mistake: .05, food: 1.0, space: 1.0 },
    { name: '紫',   hue: 272, hex: '#b47bff', mistake: .12, food: .9,  space: 1.0 },

  // ===== 工具 =====
  const DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
  };
  const DIR_LIST = [DIRS.up, DIRS.down, DIRS.left, DIRS.right];
  const key = (x, y) => x + ',' + y;
  const inside = (x, y) => x >= 0 && y >= 0 && x < WCOLS && y < WROWS;
  const allSnakes = () => [player].concat(bots);

  // ===== 摄像机 =====
  const WORLD_W = WCOLS * CELL, WORLD_H = WROWS * CELL;
  const CAM_MAX_X = Math.max(0, WORLD_W - SIZE), CAM_MAX_Y = Math.max(0, WORLD_H - SIZE);
  const clampCamX = v => Math.max(0, Math.min(CAM_MAX_X, v));
  const clampCamY = v => Math.max(0, Math.min(CAM_MAX_Y, v));

  // 渲染坐标：在上一逻辑帧与这一逻辑帧之间插值，让蛇是"滑"过去而不是一格一格跳
  function segXY(s, i, a) {
    const cur = s.body[i];
    const prev = s.prevBody;
    if (a >= 1 || !prev || !prev.length) return { x: cur.x, y: cur.y };
    const p = prev[Math.min(i, prev.length - 1)];
    return { x: p.x + (cur.x - p.x) * a, y: p.y + (cur.y - p.y) * a };
  }

  // 摄像机想对准的地方：奶龙的头
  function camFocus() {
    const h = segXY(player, 0, alpha == null ? 1 : alpha);
    return { x: (h.x + .5) * CELL, y: (h.y + .5) * CELL };
  }

  function snapCam() {
    const f = camFocus();
    cam = { x: clampCamX(f.x - SIZE / 2), y: clampCamY(f.y - SIZE / 2) };
  }

  // 棋盘上"挡路"的格子。只有自己的尾巴在本帧会腾出格子（可以追进去），
  // 别人的尾巴一律算墙——不然对手恰好这步吃到果实、尾巴没腾空时，会出现两条蛇叠在同一格。
  function blockingCells(self) {
    const set = new Set();
    for (const s of allSnakes()) {
      const n = s.body.length;
      const limit = (s === self && s.growth === 0) ? n - 1 : n;
      for (let i = 0; i < limit; i++) set.add(key(s.body[i].x, s.body[i].y));
    }
    return set;
  }

  function ownerAt(x, y, self) {
    for (const s of allSnakes()) {
      const n = s.body.length;
      const limit = (s === self && s.growth === 0) ? n - 1 : n;
      for (let i = 0; i < limit; i++)
        if (s.body[i].x === x && s.body[i].y === y) return s;
    }
    return null;
  }

  function occupiedAll() {
    const set = new Set();
    for (const s of allSnakes()) for (const c of s.body) set.add(key(c.x, c.y));
    for (const f of foods) set.add(key(f.x, f.y));
    return set;
  }

  // ===== 果实 =====
  function dropExpired(now) {
    for (let i = foods.length - 1; i >= 0; i--) {
      const f = foods[i];
      if (f.ttl != null && now - f.born >= f.ttl) {
        burst(f.x, f.y, 6, '#ff9ec9');
        foods.splice(i, 1);
      }
    }
  }

  function spawnFoods(now) {
    if (now == null) now = performance.now();
    dropExpired(now);
    let need = FOOD_TARGET - foods.reduce((n, f) => n + (f.kind === 'normal' ? 1 : 0), 0);
    if (need <= 0) return;
    const taken = occupiedAll();
    while (need-- > 0) {
      const c = pickFoodCell(taken);
      if (!c) {                           // 地图被塞满了
        if (!foods.length) win();
        return;
      }
      taken.add(key(c.x, c.y));
      foods.push({ x: c.x, y: c.y, kind: 'normal', born: now });
    }
  }

  // 普通果实优先撒在奶龙附近的一圈里（跳一跳够得着），逼着你开着镜头到处跑，
  // 而不是缩在角落等果实送上门；万一附近没位置，再退回全地图随机。
  function pickFoodCell(taken) {
    const ph = player.body[0];
    for (let i = 0; i < 140; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = FOOD_MIN + Math.random() * (FOOD_MAX - FOOD_MIN);
      const x = Math.round(ph.x + Math.cos(a) * r);
      const y = Math.round(ph.y + Math.sin(a) * r);
      if (!inside(x, y) || taken.has(key(x, y))) continue;
      return { x, y };
    }
    const free = [];
    for (let y = 0; y < WROWS; y++)
      for (let x = 0; x < WCOLS; x++)
        if (!taken.has(key(x, y))) free.push({ x, y });
    return free.length ? free[(Math.random() * free.length) | 0] : null;
  }

  // 对手阵亡后，它的身体原地变成遗骸果实
  function dropRelics(bot) {
    const taken = occupiedAll();
    const now = performance.now();
    let n = 0;
    for (let i = 0; i < bot.body.length && n < RELIC_DROP_MAX; i++) {
      const c = bot.body[i];
      if (taken.has(key(c.x, c.y))) continue;
      if (foods.length >= MAX_FOODS) break;
      taken.add(key(c.x, c.y));
      foods.push({ x: c.x, y: c.y, kind: 'relic', born: now, ttl: RELIC_TTL });
      n++;
    }
    return n;
  }

  // ===== 对手 =====
  function addBot(cells, dirName, styleName, now) {
    const style = BOT_STYLES.find(s => s.name === styleName) || BOT_STYLES[0];
    const bot = {
      name: style.name, isPlayer: false, style,
      body: cells.map(c => ({ x: c.x, y: c.y })),
      prevBody: cells.map(c => ({ x: c.x, y: c.y })),        // 渲染插值用的上一帧位置
      dir: Object.assign({}, DIRS[dirName] || DIRS.left),
      queue: [], growth: 0, born: now == null ? performance.now() : now
    };
    bots.push(bot);
    return bot;
  }

  // 找一个离玩家够远、身体和头前方一格都空着的位置投胎
  function spawnBot(now) {
    if (bots.length >= BOT_COUNT) return false;
    const used = new Set(bots.map(b => b.name));
    const style = BOT_STYLES.find(s => !used.has(s.name));
    if (!style) return false;
    const taken = occupiedAll();
    const ph = player.body[0];

    for (let attempt = 0; attempt < 400; attempt++) {
      const x = 1 + ((Math.random() * (WCOLS - 2)) | 0);
      const y = 1 + ((Math.random() * (WROWS - 2)) | 0);
      const dist = Math.abs(x - ph.x) + Math.abs(y - ph.y);
      if (dist < 12) continue;                 // 别在奶龙眼皮底下投胎
      if (dist > 26 && attempt < 260) continue; // 优选"看得见又够不着"的中距离


      const dirs = DIR_LIST.slice();
      for (let i = dirs.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        const t = dirs[i]; dirs[i] = dirs[j]; dirs[j] = t;
      }
      for (const d of dirs) {
        const cells = [];
        let ok = true;
        for (let i = 0; i < BOT_LEN; i++) {
          const cx = x - d.x * i, cy = y - d.y * i;
          if (!inside(cx, cy) || taken.has(key(cx, cy))) { ok = false; break; }
          cells.push({ x: cx, y: cy });
        }
        if (!ok || !inside(x + d.x, y + d.y)) continue;    // 头前方也得有路
        const name = Object.keys(DIRS).find(k => DIRS[k] === d);
        addBot(cells, name, style.name, now);
        return true;
      }
    }
    return false;
  }

  // 从 (x,y) 出发能摸到多少空格子（上限 cap，防止每次都数满全图）
  function floodCount(x, y, blocked, cap) {
    cap = cap || 190;                            // 地图大了，数得太少所有方向都会顶到上限，AI 就没法比较了
    const seen = new Set([key(x, y)]);
    const q = [[x, y]];
    let n = 0;
    while (q.length && n < cap) {
      const c = q.shift();
      n++;
      for (const d of DIR_LIST) {
        const nx = c[0] + d.x, ny = c[1] + d.y;
        if (!inside(nx, ny)) continue;
        const k = key(nx, ny);
        if (seen.has(k) || blocked.has(k)) continue;
        seen.add(k); q.push([nx, ny]);
      }
    }
    return n;
  }

  function nearestFoodDist(x, y) {
    let m = Infinity;
    for (const f of foods) {
      const d = Math.abs(f.x - x) + Math.abs(f.y - y);
      if (d < m) m = d;
    }
    return m === Infinity ? 0 : m;
  }

  // 别的蛇头旁边很危险（同时抢一格 = 同归于尽），给个惩罚
  function headDanger(x, y, self) {
    let d = 0;
    for (const s of allSnakes()) {
      if (s === self) continue;
      const h = s.body[0];
      const dist = Math.abs(h.x - x) + Math.abs(h.y - y);
      if (dist === 1) d += 2; else if (dist === 2) d += 1;
    }
    return d;
  }

  function botThink(bot, blocked) {
    const head = bot.body[0];
    const cands = [];
    for (const d of DIR_LIST) {
      if (d.x === -bot.dir.x && d.y === -bot.dir.y) continue;   // 不能掉头
      const nx = head.x + d.x, ny = head.y + d.y;
      if (!inside(nx, ny) || blocked.has(key(nx, ny))) continue;
      cands.push({ d, nx, ny });
    }
    if (!cands.length) return;                                  // 走投无路，就按原方向撞上去
    const st = bot.style;
    if (Math.random() < st.mistake) {                           // 偶尔犯浑
      bot.dir = cands[(Math.random() * cands.length) | 0].d;
      return;
    }
    let bestC = cands[0], bestS = -Infinity;
    for (const c of cands) {
      let sc = 0;
      sc -= nearestFoodDist(c.nx, c.ny) * 6 * st.food;          // 去抢最近的果实
      sc += floodCount(c.nx, c.ny, blocked) * 3 * st.space;     // 给自己留活路
      sc -= headDanger(c.nx, c.ny, bot) * 14;                   // 躲开正面对撞
      if (c.nx === 0 || c.ny === 0 || c.nx === WCOLS - 1 || c.ny === WROWS - 1) sc -= 4;
      sc += Math.random() * 2;
      if (sc > bestS) { bestS = sc; bestC = c; }
    }
    bot.dir = bestC.d;
  }

  // ===== 生命周期 =====
  function reset() {
    const now = performance.now();
    const cx = WCOLS >> 1, cy = WROWS >> 1;              // 从世界中心出发
    player = {
      name: '奶龙', isPlayer: true, style: null,
      body: [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }],
      prevBody: [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }],
      dir: { x: 1, y: 0 }, queue: [], growth: 0, born: now
    };
    bots = []; foods = [];
    score = 0; kills = 0;
    tickMs = SPEEDS[speedKey].tick;
    acc = 0; last = now;
    particles = []; floaters = []; shakeT = 0; pulse = 0; pulseColor = '#35e07a';
    respawnT = 0;
    alpha = 1;
    snapCam();                                            // 开局镜头直接架在奶龙头顶，不要从角落甩过来
    for (let i = 0; i < BOT_COUNT; i++) spawnBot(now);
    spawnFoods(now);
    syncHud();
    draw(now);
  }

  function start() {
    reset();
    state = STATE.PLAYING;
    el.ov.classList.add('hide');
    el.pauseBtn.textContent = '暂停';
  }

  function togglePause(force) {
    if (state === STATE.PLAYING) {
      state = STATE.PAUSED;
      el.pauseBtn.textContent = '继续';
      showOverlay('已暂停', '喝口水，回来接着吃。', '继续游戏', false);
    } else if (state === STATE.PAUSED) {
      state = STATE.PLAYING;
      last = performance.now();
      el.pauseBtn.textContent = '暂停';
      el.ov.classList.add('hide');
    }
  }

  function showOverlay(title, text, btn, withLegend) {
    el.ovTitle.textContent = title;
    el.ovText.innerHTML = text;
    el.ovLegend.style.display = withLegend === false ? 'none' : 'flex';
    el.ovBtn.textContent = btn;
    el.ov.classList.remove('hide');
  }

  function gameOver(reason) {
    state = STATE.OVER;
    if (score > best) {
      best = score;
      localStorage.setItem('neon-snake-best', String(best));
      el.best.textContent = best;
    }
    el.ovTitle.textContent = '游戏结束';
    el.ovText.innerHTML = reason;
    el.ovLegend.style.display = 'none';
    el.ovFinal.style.display = 'block';
    el.ovFinal.innerHTML = '本局得分 ' + score + ' · 长度 ' + player.body.length + ' · 击杀 ' + kills;
    el.ovBtn.textContent = '再来一局';
    el.ov.classList.remove('hide');
    el.pauseBtn.textContent = '暂停';
    burst(player.body[0].x, player.body[0].y, 26, '#ffce40');
    shakeT = 320;
  }

  function win() {
    state = STATE.OVER;
    if (score > best) { best = score; localStorage.setItem('neon-snake-best', String(best)); el.best.textContent = best; }
    el.ovTitle.textContent = '完美通关！';
    el.ovText.innerHTML = '你把整块棋盘都吃满了，强得离谱。';
    el.ovLegend.style.display = 'none';
    el.ovFinal.style.display = 'block';
    el.ovFinal.innerHTML = '得分 ' + score + ' · 击杀 ' + kills;
    el.ovBtn.textContent = '再来一局';
    el.ov.classList.remove('hide');
  }

  function syncHud() {
    el.score.textContent = score;
    el.len.textContent = player.body.length;
    el.best.textContent = best;
    el.kills.textContent = kills;
    el.bots.textContent = bots.length;
  }

  // ===== 输入 =====
  function turn(name) {
    const d = DIRS[name];
    if (!d) return;
    if (state === STATE.READY || state === STATE.OVER) { start(); return; }
    if (state === STATE.PAUSED) togglePause();
    const ref = player.queue.length ? player.queue[player.queue.length - 1] : player.dir;
    if (d.x === -ref.x && d.y === -ref.y) return;   // 禁止 180° 掉头
    if (d.x === ref.x && d.y === ref.y) return;     // 重复方向忽略
    if (player.queue.length < 2) player.queue.push(d);
  }

  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  window.addEventListener('keydown', e => {
    if (KEYMAP[e.key]) { e.preventDefault(); turn(KEYMAP[e.key]); return; }
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === STATE.READY || state === STATE.OVER) start(); else togglePause();
      return;
    }
    if (e.key === 'r' || e.key === 'R') { start(); return; }
    if (e.key >= '1' && e.key <= '3') {
      speedKey = Number(e.key);
      tickMs = SPEEDS[speedKey].tick;
    }
  }, { passive: false });

  document.querySelectorAll('.pad button[data-dir]').forEach(b => {
    b.addEventListener('click', () => turn(b.dataset.dir));
  });
  el.ovBtn.addEventListener('click', () => {
    if (state === STATE.PAUSED) togglePause(); else start();
  });
  el.pauseBtn.addEventListener('click', () => {
    if (state === STATE.READY || state === STATE.OVER) start(); else togglePause();
  });

  // 触屏滑动
  let touch = null;
  canvas.addEventListener('touchstart', e => {
    touch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touch) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    if (Math.hypot(dx, dy) < 24) { if (state === STATE.PAUSED) togglePause(); return; }
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    touch = null;
  }, { passive: true });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === STATE.PLAYING) togglePause();
  });

  // ===== 粒子 & 飘字 =====
  function burst(gx, gy, n, color) {
    const cx = (gx + .5) * CELL, cy = (gy + .5) * CELL;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 170;
      particles.push({
        x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, size: 1.5 + Math.random() * 3, color
      });
    }
  }
  function stepParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= .94; p.vy *= .94;
      p.life -= dt * 1.9;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }
  function addFloater(gx, gy, text, color) {
    floaters.push({ x: (gx + .5) * CELL, y: (gy + .5) * CELL, text, color, life: 1 });
  }
  function stepFloaters(dt) {
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.y -= dt * 28;
      f.life -= dt * 1.1;
      if (f.life <= 0) floaters.splice(i, 1);
    }
  }

  // ===== 逻辑 =====
  // 一只对手阵亡：从场上撤掉，身体变成遗骸果实
  function killBot(bot, m) {
    const i = bots.indexOf(bot);
    if (i >= 0) bots.splice(i, 1);
    dropRelics(bot);
    burst(bot.body[0].x, bot.body[0].y, 20, bot.style.hex);
    if (m.reason === 'body' && m.hit === player) {
      kills++;
      addFloater(bot.body[0].x, bot.body[0].y, '击落 ' + bot.name, bot.style.hex);
      shakeT = Math.max(shakeT, 150);
    }
    respawnT = BOT_RESPAWN_MS;      // 排队补位
  }

  function playerDie(m) {
    if (m.reason === 'wall') gameOver('你撞上了墙壁。');
    else if (m.reason === 'self') gameOver('你咬到了自己。');
    else if (m.reason === 'head') gameOver('你和对手撞了个正着，同归于尽。');
    else gameOver('你撞上了' + (m.hit ? m.hit.name : '对手') + '的身体。');
  }

  function eatAt(s, fi) {
    const f = foods[fi];
    foods.splice(fi, 1);
    // 玩家吃一颗长两节（分两帧），对手只长一节：否则一堆对手抢着吃，棋盘几分钟就被塞满了
    s.growth += s.isPlayer ? 2 : 1;
    if (s.isPlayer) {
      score += (f.kind === 'relic' ? RELIC_SCORE : 10) * speedKey;
      burst(f.x, f.y, f.kind === 'relic' ? 22 : 16, f.kind === 'relic' ? '#ff5fa2' : '#35e07a');
      pulse = 1; pulseColor = f.kind === 'relic' ? '255,95,162' : '53,224,122';
      if (f.kind === 'relic') addFloater(f.x, f.y, '+' + RELIC_SCORE * speedKey, '#ff9ec9');
      if (score % 100 === 0 && tickMs > 95) tickMs = Math.max(95, tickMs - 5);
    } else {
      burst(f.x, f.y, 8, s.style.hex);
    }
  }

  function tick() {
    const now = performance.now();
    dropExpired(now);
    // 记下这一步之前的位置：渲染时按 alpha 在两帧之间插值，镜头和蛇才是滑着走
    for (const s of allSnakes()) s.prevBody = s.body.map(c => ({ x: c.x, y: c.y }));

    // 每条蛇一份挡路格（各自的尾巴规则不同）
    const blockers = new Map();
    for (const s of allSnakes()) blockers.set(s, blockingCells(s));

    for (const b of bots) botThink(b, blockers.get(b));
    if (player.queue.length) player.dir = player.queue.shift();

    // 各蛇这一帧想去的格子
    const moves = allSnakes().map(s => ({
      s, x: s.body[0].x + s.dir.x, y: s.body[0].y + s.dir.y, reason: null, hit: null
    }));

    // 1) 撞墙
    for (const m of moves)
      if (!inside(m.x, m.y)) m.reason = 'wall';

    // 2) 头对头：抢同一格，或者互相穿过去
    for (let i = 0; i < moves.length; i++) {
      for (let j = i + 1; j < moves.length; j++) {
        const a = moves[i], b = moves[j];
        const same = a.x === b.x && a.y === b.y;
        const swap = a.x === b.s.body[0].x && a.y === b.s.body[0].y &&
                     b.x === a.s.body[0].x && b.y === a.s.body[0].y;
        if (same || swap) { if (!a.reason) a.reason = 'head'; if (!b.reason) b.reason = 'head'; }
      }
    }

    // 3) 撞身体
    for (const m of moves) {
      if (m.reason) continue;
      const blocked = blockers.get(m.s);
      if (blocked.has(key(m.x, m.y))) {
        const own = ownerAt(m.x, m.y, m.s);
        m.reason = own === m.s ? 'self' : 'body';
        m.hit = own;
      }
    }

    const dying = moves.filter(m => m.reason);

    // 活下来的蛇前进 + 吃东西
    for (const m of moves) {
      if (m.reason) continue;
      const s = m.s;
      s.body.unshift({ x: m.x, y: m.y });
      const fi = foods.findIndex(f => f.x === m.x && f.y === m.y);
      if (fi >= 0) eatAt(s, fi);
      if (s.growth > 0) s.growth--; else s.body.pop();
    }

    // 对手阵亡（先掉果实），再看玩家
    for (const m of dying) if (!m.s.isPlayer) killBot(m.s, m);
    const pm = dying.find(m => m.s.isPlayer);
    if (pm) { syncHud(); playerDie(pm); return; }

    spawnFoods(now);
    syncHud();
  }

  // ===== 绘制 =====
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawFoods(t, now) {
    for (const f of foods) {
      const cx = (f.x + .5) * CELL, cy = (f.y + .5) * CELL;

      if (f.kind === 'relic') {
        const age = now - f.born;
        const left = f.ttl == null ? Infinity : f.ttl - age;
        const scale = Math.min(1, Math.max(0, age / 220));
        const blink = left < 5000 ? .3 + .7 * Math.abs(Math.sin(t * 7)) : 1;
        const r = CELL * .36 * scale;
        ctx.save();
        ctx.globalAlpha = blink;
        ctx.shadowColor = 'rgba(255,95,162,.95)';
        ctx.shadowBlur = 20;
        const g = ctx.createRadialGradient(cx - r * .35, cy - r * .35, r * .15, cx, cy, r);
        g.addColorStop(0, '#fff0f7');
        g.addColorStop(.45, '#ff7ab8');
        g.addColorStop(1, '#e14b8f');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy);
        ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        // 外圈光环，让它一眼能和普通果实区分开
        ctx.strokeStyle = 'rgba(255,95,162,' + (.4 + Math.sin(t * 5) * .2) * blink + ')';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(cx, cy, CELL * .48, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
        continue;
      }

      const beat = 1 + Math.sin(t * 6) * .08;
      const r = CELL * .30 * beat;
      ctx.save();
      ctx.shadowColor = 'rgba(53,224,122,.95)';
      ctx.shadowBlur = 22;
      const g = ctx.createRadialGradient(cx - r * .3, cy - r * .3, r * .15, cx, cy, r);
      g.addColorStop(0, '#d8ffe8');
      g.addColorStop(.5, '#35e07a');
      g.addColorStop(1, '#0b8f4e');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = 'rgba(53,224,122,' + (.35 + Math.sin(t * 6) * .18) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, CELL * .45, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // 视野外的身体段直接跳过（地图大了，蛇可以很长）
  function offscreen(gx, gy) {
    const x = gx * CELL, y = gy * CELL;
    return x + CELL * 2 < cam.x || y + CELL * 2 < cam.y ||
           x - CELL > cam.x + SIZE || y - CELL > cam.y + SIZE;
  }

  function drawPlayer() {
    const body = player.body, n = body.length;
    for (let i = n - 1; i >= 0; i--) {
      const g = segXY(player, i, alpha);
      if (offscreen(g.x, g.y)) continue;
      const x = g.x * CELL, y = g.y * CELL;
      const k = 1 - i / Math.max(n, 12);
      const pad = CELL * (.085 + (1 - k) * .03);
      const w = CELL - pad * 2;

      if (i === 0) {
        const ccx = x + CELL / 2, ccy = y + CELL / 2;
        // 身下暖光，让奶龙和霓虹底色融在一起
        const glow = ctx.createRadialGradient(ccx, ccy, CELL * .1, ccx, ccy, CELL * .75);
        glow.addColorStop(0, 'rgba(255,206,64,.5)');
        glow.addColorStop(.55, 'rgba(255,178,32,.18)');
        glow.addColorStop(1, 'rgba(255,178,32,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(ccx, ccy, CELL * .75, 0, Math.PI * 2); ctx.fill();

        if (nailongReady) {
          // 奶龙本体：比一格略大，让它显得圆润压场；向左走时水平翻转让它面朝前方
          const box = CELL * 1.5;
          const dw = box * (nailong.width / Math.max(nailong.width, nailong.height));
          const dh = box * (nailong.height / Math.max(nailong.width, nailong.height));
          ctx.save();
          ctx.translate(ccx, ccy);
          if (player.dir.x < 0) ctx.scale(-1, 1);
          ctx.drawImage(nailong, -dw / 2, -dh / 2, dw, dh);
          ctx.restore();
        } else {
          // 图片还没解码完时的兜底：一颗黄色圆头
          ctx.save();
          ctx.shadowColor = 'rgba(255,206,64,.9)';
          ctx.shadowBlur = 20;
          const g = ctx.createLinearGradient(x, y, x + CELL, y + CELL);
          g.addColorStop(0, '#ffe98a');
          g.addColorStop(1, '#ffc42e');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(ccx, ccy, CELL * .46, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
      } else {
        const hue = 50 - (i / Math.max(n, 1)) * 8;     // 奶黄 → 暖金
        const light = 52 + k * 12;
        ctx.save();
        ctx.shadowColor = 'hsla(' + hue + ',100%,62%,.55)';
        ctx.shadowBlur = 9;
        ctx.fillStyle = 'hsl(' + hue + ',100%,' + light + '%)';
        roundRect(x + pad, y + pad, w, w, CELL * .28);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  function drawBot(bot, now) {
    const body = bot.body, n = body.length, hue = bot.style.hue;
    for (let i = n - 1; i >= 0; i--) {
      const g = segXY(bot, i, alpha);
      if (offscreen(g.x, g.y)) continue;
      const x = g.x * CELL, y = g.y * CELL;
      const k = 1 - i / Math.max(n, 12);

      if (i === 0) {
        const cx = x + CELL / 2, cy = y + CELL / 2;
        const glow = ctx.createRadialGradient(cx, cy, CELL * .08, cx, cy, CELL * .72);
        glow.addColorStop(0, 'hsla(' + hue + ',100%,66%,.42)');
        glow.addColorStop(1, 'hsla(' + hue + ',100%,66%,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(cx, cy, CELL * .72, 0, Math.PI * 2); ctx.fill();

        ctx.save();
        ctx.shadowColor = 'hsla(' + hue + ',100%,62%,.85)';
        ctx.shadowBlur = 16;
        const g = ctx.createLinearGradient(x, y, x + CELL, y + CELL);
        g.addColorStop(0, 'hsl(' + hue + ',100%,76%)');
        g.addColorStop(1, 'hsl(' + hue + ',95%,50%)');
        ctx.fillStyle = g;
        const hs = CELL * 1.02, hp = (CELL - hs) / 2;
        roundRect(x + hp, y + hp, hs, hs, CELL * .34);
        ctx.fill();
        ctx.restore();

        // 眼睛朝着前进方向
        const fx = bot.dir.x, fy = bot.dir.y, px = -fy, py = fx;
        ctx.fillStyle = 'rgba(6,14,26,.9)';
        const er = CELL * .105, ef = CELL * .135, eo = CELL * .17;
        ctx.beginPath(); ctx.arc(cx + fx * ef + px * eo, cy + fy * ef + py * eo, er, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + fx * ef - px * eo, cy + fy * ef - py * eo, er, 0, Math.PI * 2); ctx.fill();

        // 刚投胎时的一圈白环
        const age = now - bot.born;
        if (age >= 0 && age < 560) {
          ctx.strokeStyle = 'hsla(' + hue + ',100%,82%,' + (1 - age / 560) * .9 + ')';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(cx, cy, CELL * (.5 + age / 560 * 1.1), 0, Math.PI * 2); ctx.stroke();
        }
      } else {
        const pad = CELL * (.085 + (1 - k) * .03);
        const w = CELL - pad * 2;
        ctx.save();
        ctx.shadowColor = 'hsla(' + hue + ',100%,62%,.5)';
        ctx.shadowBlur = 8;
        ctx.fillStyle = 'hsl(' + hue + ',' + Math.round(72 + k * 24) + '%,' + Math.round(44 + k * 16) + '%)';
        roundRect(x + pad, y + pad, w, w, CELL * .28);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  function draw(now) {
    now = now || 0;
    const t = now / 1000;
    ctx.save();
    if (shakeT > 0) {
      const s = (shakeT / 320) * 5;
      ctx.translate((Math.random() - .5) * s, (Math.random() - .5) * s);
    }

    // 还没走到的世界之外：一片近乎全黑的虚空
    ctx.fillStyle = '#05080f';
    ctx.fillRect(-20, -20, SIZE + 40, SIZE + 40);

    // 镜头：把整个世界反向推走，就相当于视角跟着奶龙跑
    ctx.save();
    ctx.translate(-cam.x, -cam.y);

    // 镜头这一屏真正覆盖到的那块世界
    const vx0 = Math.max(0, cam.x), vy0 = Math.max(0, cam.y);
    const vx1 = Math.min(WORLD_W, cam.x + SIZE), vy1 = Math.min(WORLD_H, cam.y + SIZE);
    if (vx1 > vx0 && vy1 > vy0) {
      const bg = ctx.createLinearGradient(vx0, vy0, vx0 + SIZE, vy0 + SIZE);
      bg.addColorStop(0, '#0a1122');
      bg.addColorStop(1, '#0c0a1c');
      ctx.fillStyle = bg;
      ctx.fillRect(vx0, vy0, vx1 - vx0, vy1 - vy0);
    }

    // 网格：只画看得见的那几十条线
    const gx0 = Math.max(0, Math.floor(cam.x / CELL)), gx1 = Math.min(WCOLS, Math.ceil((cam.x + SIZE) / CELL));
    const gy0 = Math.max(0, Math.floor(cam.y / CELL)), gy1 = Math.min(WROWS, Math.ceil((cam.y + SIZE) / CELL));
    ctx.strokeStyle = 'rgba(120,200,255,.07)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = gx0; i <= gx1; i++) { ctx.moveTo(i * CELL, gy0 * CELL); ctx.lineTo(i * CELL, gy1 * CELL); }
    for (let j = gy0; j <= gy1; j++) { ctx.moveTo(gx0 * CELL, j * CELL); ctx.lineTo(gx1 * CELL, j * CELL); }
    ctx.stroke();

    drawFoods(t, now);

    // 对手画在下面，奶龙压在最上层
    for (const b of bots) drawBot(b, now);
    drawPlayer();

    // 粒子
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // 飘字
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    floaters.forEach(f => {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
      ctx.fillStyle = f.color;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 12;
      ctx.font = '800 ' + (CELL * .72) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(f.text, f.x, f.y);
      ctx.shadowBlur = 0;
    });
    ctx.globalAlpha = 1;

    // 吃到果实时的一圈脉冲（围着奶龙的脑袋扩散）
    if (pulse > 0) {
      const h = player.body[0];
      ctx.strokeStyle = 'rgba(' + pulseColor + ',' + pulse * .6 + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc((h.x + .5) * CELL, (h.y + .5) * CELL, (1 - pulse) * SIZE * .55, 0, Math.PI * 2);
      ctx.stroke();
      pulse = Math.max(0, pulse - 0.02);
    }

    // 世界边墙：撞上去就死，所以做得显眼
    ctx.strokeStyle = 'rgba(120,200,255,.55)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(0, 3); ctx.lineTo(WORLD_W, 3);
    ctx.moveTo(0, WORLD_H - 3); ctx.lineTo(WORLD_W, WORLD_H - 3);
    ctx.moveTo(3, 0); ctx.lineTo(3, WORLD_H);
    ctx.moveTo(WORLD_W - 3, 0); ctx.lineTo(WORLD_W - 3, WORLD_H);
    ctx.stroke();

    ctx.restore();                        // 退回屏幕坐标

    edgeWarn();                           // 贴到世界边缘时红了

    ctx.restore();
    drawMinimap();                        // 右上角小地图（不跟着镜头抖）
  }

  // 视野贴上世界某一边时，那一侧泛一圈红光，提醒"再往前就是墙"
  function edgeWarn() {
    const W = 52;
    const fade = (x0, y0, x1, y1) => {
      const g = ctx.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, 'rgba(255,64,96,.30)');
      g.addColorStop(1, 'rgba(255,64,96,0)');
      return g;
    };
    if (cam.x <= 0.5) { ctx.fillStyle = fade(0, 0, W, 0); ctx.fillRect(0, 0, W, SIZE); }
    if (cam.x >= CAM_MAX_X - 0.5) { ctx.fillStyle = fade(SIZE, 0, SIZE - W, 0); ctx.fillRect(SIZE - W, 0, W, SIZE); }
    if (cam.y <= 0.5) { ctx.fillStyle = fade(0, 0, 0, W); ctx.fillRect(0, 0, SIZE, W); }
    if (cam.y >= CAM_MAX_Y - 0.5) { ctx.fillStyle = fade(0, SIZE, 0, SIZE - W); ctx.fillRect(0, SIZE - W, SIZE, W); }
  }

  // 右上角小地图：一眼看到自己在世界的哪儿、对手和果实在哪
  function drawMinimap() {
    const M = 92, pad = 10;
    const x0 = SIZE - M - pad, y0 = pad;
    const s = M / WORLD_W;
    const ph = player.body[0];
    ctx.save();
    ctx.globalAlpha = .82;
    ctx.fillStyle = 'rgba(8,13,28,.9)';
    roundRect(x0, y0, M, M, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(120,200,255,.3)';
    ctx.lineWidth = 1;
    roundRect(x0 + .5, y0 + .5, M - 1, M - 1, 10); ctx.stroke();

    for (const f of foods) {
      ctx.fillStyle = f.kind === 'relic' ? 'rgba(255,95,162,.95)' : 'rgba(53,224,122,.9)';
      ctx.fillRect(x0 + (f.x + .5) * CELL * s - 1, y0 + (f.y + .5) * CELL * s - 1, 2.4, 2.4);
    }
    for (const b of bots) {
      const h = b.body[0];
      ctx.fillStyle = b.style.hex;
      ctx.beginPath(); ctx.arc(x0 + (h.x + .5) * CELL * s, y0 + (h.y + .5) * CELL * s, 2.6, 0, Math.PI * 2); ctx.fill();
    }
    // 当前视野范围
    ctx.strokeStyle = 'rgba(219,233,255,.32)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x0 + cam.x * s, y0 + cam.y * s, SIZE * s, SIZE * s);
    // 奶龙
    const px = x0 + (ph.x + .5) * CELL * s, py = y0 + (ph.y + .5) * CELL * s;
    ctx.fillStyle = '#ffc42e';
    ctx.beginPath(); ctx.arc(px, py, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ===== 主循环 =====
  function loop(now) {
    const dt = Math.min((now - last) / 1000, .25);
    last = now;
    if (shakeT > 0) shakeT = Math.max(0, shakeT - dt * 1000);

    if (state === STATE.PLAYING) {
      // 阵亡的对手排队补位
      if (bots.length < BOT_COUNT) {
        respawnT -= dt * 1000;
        if (respawnT <= 0) respawnT = spawnBot(now) ? 0 : 700;
      }
      acc += dt * 1000;
      let guard = 0;
      while (acc >= tickMs && state === STATE.PLAYING && guard++ < 5) {
        acc -= tickMs;
        tick();
      }
    } else {
      acc = 0;
    }

    // 两次逻辑步之间的渲染进度：蛇和对手靠它滑着走，而不是一格格跳
    alpha = state === STATE.PLAYING ? Math.max(0, Math.min(1, acc / tickMs)) : 1;

    // 镜头平滑跟随奶龙（并停在世界边缘，不会推出地图外）
    if (state !== STATE.READY && cam) {
      const f = camFocus();
      const k = 1 - Math.exp(-CAM_EASE * dt);
      cam.x += (clampCamX(f.x - SIZE / 2) - cam.x) * k;
      cam.y += (clampCamY(f.y - SIZE / 2) - cam.y) * k;
    }

    stepParticles(dt);
    stepFloaters(dt);
    draw(now);
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
